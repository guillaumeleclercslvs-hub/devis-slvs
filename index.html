const BASE_CLIENTS = PRICE_DATA.clients;
const CATEGORIES = PRICE_DATA.categories;

const MAIN_OEUVRE_DEFAULTS = [
  { id: 'heures', poste: 'Heures', tarif: 58 },
  { id: 'heures_samedi', poste: 'Heures samedi', tarif: 75 },
  { id: 'etude', poste: 'Étude', tarif: 60 },
];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function euros(n) {
  const v = typeof n === 'number' && !isNaN(n) ? n : 0;
  return v.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}

function splitTexteLignes(txt) {
  if (!txt) return [];
  const result = [];
  let current = '';
  for (let i = 0; i < txt.length; i++) {
    current += txt[i];
    if ('.!?:'.indexOf(txt[i]) !== -1) {
      const next = txt[i + 1];
      if (next === undefined || /\s/.test(next)) {
        result.push(current.trim());
        current = '';
      }
    }
  }
  if (current.trim()) result.push(current.trim());
  return result.filter(Boolean);
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function emptyDevis() {
  return {
    id: uid(),
    numero: '',
    date: todayISO(),
    type: 'Devis',
    mode: 'Direct',
    client: '',
    donneurOrdre: '',
    chantier: '',
    dossier: '',
    texte: '',
    marge: 35,
    consommable: { montant: 0, marge: 35 },
    sousTraitant: { montant: 0, marge: 20 },
    mainOeuvre: MAIN_OEUVRE_DEFAULTS.map((m) => ({ id: m.id, poste: m.poste, nombre: 0, tarif: m.tarif })),
    travaux: [],
    createdAt: new Date().toISOString(),
  };
}

function computeTotals(devis) {
  const moHeuresTotal = devis.mainOeuvre.reduce((s, l) => s + (Number(l.nombre) || 0) * (Number(l.tarif) || 0), 0);
  const consoMontant = Number(devis.consommable ? devis.consommable.montant : 0) || 0;
  const consoMarge = Number(devis.consommable ? devis.consommable.marge : 0) || 0;
  const consoTotal = Math.round(consoMontant * (1 + consoMarge / 100) * 100) / 100;
  const stMontant = Number(devis.sousTraitant ? devis.sousTraitant.montant : 0) || 0;
  const stMarge = Number(devis.sousTraitant ? devis.sousTraitant.marge : 0) || 0;
  const stTotal = Math.round(stMontant * (1 + stMarge / 100) * 100) / 100;
  const moTotal = moHeuresTotal + consoTotal + stTotal;
  const travTotalAchat = devis.travaux.reduce((s, l) => s + (Number(l.quantite) || 0) * (Number(l.prixUnitaire) || 0), 0);
  const margeNum = Number(devis.marge) || 0;
  const travTotal = Math.round(travTotalAchat * (1 + margeNum / 100) * 100) / 100;
  return { moHeuresTotal, consoTotal, stTotal, moTotal, travTotalAchat, travTotal, total: moTotal + travTotal };
}

function RivetPlate({ children, className = '' }) {
  return (
    <div className={`rivet-plate ${className}`}>
      <span className="rivet rivet-tl" />
      <span className="rivet rivet-tr" />
      <span className="rivet rivet-bl" />
      <span className="rivet rivet-br" />
      {children}
    </div>
  );
}

function Field({ label, children, mono = false }) {
  return (
    <label className="field">
      <span className="field-label">{label}</span>
      {children}
    </label>
  );
}

function DevisApp() {
  const [tab, setTab] = useState('nouveau');
  const [devis, setDevis] = useState(emptyDevis);
  const [savedList, setSavedList] = useState([]);
  const [customClients, setCustomClients] = useState([]);
  const [customFolders, setCustomFolders] = useState([]);
  const [newFolderName, setNewFolderName] = useState('');
  const [openFolders, setOpenFolders] = useState({});
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState(null);
  const [clientQuery, setClientQuery] = useState('');
  const [newClientName, setNewClientName] = useState('');
  const [showClientPicker, setShowClientPicker] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const idx = await window.storage.get('devis:index');
        if (idx) setSavedList(JSON.parse(idx.value));
      } catch (e) { /* no index yet */ }
      try {
        const cc = await window.storage.get('clients:custom');
        if (cc) setCustomClients(JSON.parse(cc.value));
      } catch (e) { /* none yet */ }
      try {
        const cf = await window.storage.get('folders:custom');
        if (cf) setCustomFolders(JSON.parse(cf.value));
      } catch (e) { /* none yet */ }
      setLoading(false);
    })();
  }, []);

  function showToast(msg, kind = 'ok') {
    setToast({ msg, kind });
    setTimeout(() => setToast(null), 2200);
  }

  const allClients = useMemo(() => {
    const set = new Set([...BASE_CLIENTS, ...customClients]);
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'fr'));
  }, [customClients]);

  const filteredClients = useMemo(() => {
    const q = clientQuery.trim().toLowerCase();
    if (!q) return allClients;
    return allClients.filter((c) => c.toLowerCase().includes(q));
  }, [allClients, clientQuery]);

  const allFolders = useMemo(() => {
    const fromSaved = savedList.map((e) => e.dossier).filter(Boolean);
    const set = new Set([...customFolders, ...fromSaved]);
    return Array.from(set).sort((a, b) => a.localeCompare(b, 'fr'));
  }, [savedList, customFolders]);

  async function addCustomFolder(name) {
    const trimmed = name.trim();
    if (!trimmed || allFolders.includes(trimmed)) return;
    const next = [...customFolders, trimmed];
    setCustomFolders(next);
    try {
      await window.storage.set('folders:custom', JSON.stringify(next), false);
    } catch (e) { /* best effort */ }
  }

  async function persistIndexEntry(d) {
    const totals = computeTotals(d);
    const entry = { id: d.id, numero: d.numero || '(sans n°)', client: d.client || '—', date: d.date, total: totals.total, dossier: d.dossier || '' };
    const newList = [entry, ...savedList.filter((e) => e.id !== d.id)];
    setSavedList(newList);
    try {
      await window.storage.set('devis:index', JSON.stringify(newList), false);
    } catch (e) {
      showToast("Erreur d'enregistrement de l'index", 'err');
    }
  }

  async function saveDevis() {
    if (!devis.client) {
      showToast('Choisissez un client avant d’enregistrer', 'err');
      return;
    }
    try {
      const result = await window.storage.set(`devis:${devis.id}`, JSON.stringify(devis), false);
      if (!result) throw new Error('save failed');
      await persistIndexEntry(devis);
      showToast('Devis enregistré');
    } catch (e) {
      showToast('Échec de l’enregistrement', 'err');
    }
  }

  async function loadDevis(id) {
    try {
      const res = await window.storage.get(`devis:${id}`);
      if (res) {
        const parsed = JSON.parse(res.value);
        if (parsed.marge === undefined) parsed.marge = 35;
        if (!parsed.consommable) parsed.consommable = { montant: 0, marge: 35 };
        if (!parsed.sousTraitant) parsed.sousTraitant = { montant: 0, marge: 20 };
        if (parsed.dossier === undefined) parsed.dossier = '';
        setDevis(parsed);
        setTab('nouveau');
      }
    } catch (e) {
      showToast('Impossible de charger ce devis', 'err');
    }
  }

  async function deleteDevis(id) {
    try {
      await window.storage.delete(`devis:${id}`);
      const newList = savedList.filter((e) => e.id !== id);
      setSavedList(newList);
      await window.storage.set('devis:index', JSON.stringify(newList), false);
      showToast('Devis supprimé');
    } catch (e) {
      showToast('Échec de la suppression', 'err');
    }
  }

  async function addCustomClient(name) {
    const trimmed = name.trim();
    if (!trimmed || allClients.includes(trimmed)) return;
    const next = [...customClients, trimmed];
    setCustomClients(next);
    try {
      await window.storage.set('clients:custom', JSON.stringify(next), false);
    } catch (e) { /* best effort */ }
  }

  function newDevis() {
    setDevis(emptyDevis());
    setTab('nouveau');
    showToast('Nouveau devis prêt');
  }

  function exportDevisFile() {
    try {
      const blob = new Blob([JSON.stringify(devis, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const nom = (devis.numero || 'devis').replace(/[^a-zA-Z0-9-_]/g, '_');
      a.href = url;
      a.download = `devis_${nom}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Fichier téléchargé — enregistrez-le où vous voulez (OneDrive, etc.)');
    } catch (e) {
      showToast('Échec de l’export', 'err');
    }
  }

  function importDevisFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed.marge === undefined) parsed.marge = 35;
        if (!parsed.consommable) parsed.consommable = { montant: 0, marge: 35 };
        if (!parsed.sousTraitant) parsed.sousTraitant = { montant: 0, marge: 20 };

        setDevis(parsed);
        setTab('nouveau');
        showToast('Devis importé');
      } catch (err) {
        showToast('Fichier invalide', 'err');
      }
    };
    reader.readAsText(file);
  }

  function updateHeader(field, value) {
    setDevis((d) => ({ ...d, [field]: value }));
  }

  function updateMainOeuvre(id, field, value) {

  function updateConsommable(field, value) {
    setDevis((d) => ({ ...d, consommable: { ...d.consommable, [field]: value } }));
  }

  function updateSousTraitant(field, value) {
    setDevis((d) => ({ ...d, sousTraitant: { ...d.sousTraitant, [field]: value } }));

    setDevis((d) => ({

  }

                <select value={devis.type} onChange={(e) => updateHeader('type', e.target.value)}>
                  <option>Devis</option>
                  <option>Facture</option>
                  <option>Avoir</option>
                  <option>Régie</option>
                </select>
              </Field>
              <Field label="Mode">
                <select value={devis.mode} onChange={(e) => updateHeader('mode', e.target.value)}>
                  <option>Direct</option>
                  <option>Sous-traitance</option>
                </select>
              </Field>
            </div>
            <Field label="Client">
              <div className="client-picker">
                <div
                  className={`client-picker-btn ${!devis.client ? 'empty' : ''}`}
                  onClick={() => setShowClientPicker((s) => !s)}
                >
                  {devis.client || 'Sélectionner un client'} <ChevronDown size={15} />
                </div>
                {showClientPicker && (
                  <div className="client-dropdown">
                    <div className="client-dropdown-search">
                      <input
                        autoFocus
                        placeholder="Rechercher..."
                        value={clientQuery}
                        onChange={(e) => setClientQuery(e.target.value)}
                      />
                    </div>
                    {filteredClients.map((c) => (
                      <div
                        key={c}
                        className="client-option"
                        onClick={() => { updateHeader('client', c); setShowClientPicker(false); setClientQuery(''); }}
                      >
                        {c}
                      </div>
                    ))}
                    {clientQuery.trim() && !allClients.some((c) => c.toLowerCase() === clientQuery.trim().toLowerCase()) && (
                      <div
                        className="client-add"
                        onClick={async () => {
                          await addCustomClient(clientQuery.trim());
                          updateHeader('client', clientQuery.trim());
                          setShowClientPicker(false);
                          setClientQuery('');
                        }}
                      >
                        + Ajouter "{clientQuery.trim()}"
                      </div>
                    )}
                  </div>
                )}
              </div>
            </Field>
            <div className="row2">
              <Field label="Donneur d'ordre">
                <input value={devis.donneurOrdre} onChange={(e) => updateHeader('donneurOrdre', e.target.value)} />
              </Field>
              <Field label="Chantier / site">
                <input value={devis.chantier} onChange={(e) => updateHeader('chantier', e.target.value)} />
              </Field>
            </div>
            <Field label="Dossier (optionnel)">
              <input
                list="foldersDatalist"
                value={devis.dossier}
                onChange={(e) => updateHeader('dossier', e.target.value)}
                placeholder="Aucun — laisser vide pour la racine"
              />
              <datalist id="foldersDatalist">
                {allFolders.map((f) => <option key={f} value={f} />)}
              </datalist>
            </Field>
            <Field label="Texte du devis">
              <textarea value={devis.texte} onChange={(e) => updateHeader('texte', e.target.value)} placeholder="Description, conditions..." />
            </Field>
          </RivetPlate>

          <RivetPlate>
            <div className="section-label"><Hammer size={13} /> Main d'œuvre <span className="rule" /></div>
            <div className="mo-line mo-header">
              <div>Poste</div>
              <div>Nb / Montant</div>
              <div>Tarif / Marge %</div>
              <div style={{textAlign: 'right'}}>Total</div>
            </div>
            {devis.mainOeuvre.map((l) => (
              <div className="mo-line" key={l.id}>
                <div className="mo-static">{l.poste}</div>
                <input
                  type="number" min="0" step="0.5" className="mono"
                  value={l.nombre}
                  onChange={(e) => updateMainOeuvre(l.id, 'nombre', parseFloat(e.target.value) || 0)}
                />
                <input
                  type="number" min="0" step="1" className="mono"
                  value={l.tarif}
                  onChange={(e) => updateMainOeuvre(l.id, 'tarif', parseFloat(e.target.value) || 0)}
                />
                <div className="mo-total mono">{euros((Number(l.nombre) || 0) * (Number(l.tarif) || 0))}</div>
              </div>
            ))}
            <div className="mo-line">
              <div className="mo-static">Consommable</div>
              <input
                type="number" min="0" step="0.01" className="mono"
                value={devis.consommable.montant}
                onChange={(e) => updateConsommable('montant', parseFloat(e.target.value) || 0)}
              />
              <input
                type="number" min="0" step="1" className="mono"
                value={devis.consommable.marge}
                onChange={(e) => updateConsommable('marge', parseFloat(e.target.value) || 0)}
              />
              <div className="mo-total mono">{euros(totals.consoTotal)}</div>
            </div>
            <div className="mo-line">
              <div className="mo-static">Sous-traitant</div>
              <input
                type="number" min="0" step="0.01" className="mono"
                value={devis.sousTraitant.montant}
                onChange={(e) => updateSousTraitant('montant', parseFloat(e.target.value) || 0)}
              />
              <input
                type="number" min="0" step="1" className="mono"
                value={devis.sousTraitant.marge}
                onChange={(e) => updateSousTraitant('marge', parseFloat(e.target.value) || 0)}
              />
              <div className="mo-total mono">{euros(totals.stTotal)}</div>
            </div>
          </RivetPlate>

          <RivetPlate>
            <div className="section-label"><Wrench size={13} /> Travaux <span className="rule" /></div>
            <Field label="Marge (%) — appliquée au prix catalogue">
              <input
                type="number" min="0" step="1" className="mono"
                value={devis.marge}
                onChange={(e) => updateHeader('marge', parseFloat(e.target.value) || 0)}
              />
            </Field>
            {devis.travaux.map((l) => {
              const materiels = l.categorie ? Object.keys(CATEGORIES[l.categorie] || {}) : [];
              const refs = l.categorie && l.materiel ? (CATEGORIES[l.categorie][l.materiel] || []) : [];
              return (
                <div className="trav-card" key={l.id}>
                  <label className="fournisseur-toggle">
                    <input
                      type="checkbox"
                      checked={!!l.fournisseur}
                      onChange={(e) => updateTravauxLine(l.id, { fournisseur: e.target.checked, categorie: '', materiel: '', ref: '', prixUnitaire: 0, designation: l.designation || '' })}
                    />
                    Devis fournisseur (saisie directe, hors catalogue)
                  </label>
                  {l.fournisseur ? (
                    <Field label="Désignation">
                      <input
                        value={l.designation || ''}
                        onChange={(e) => updateTravauxLine(l.id, { designation: e.target.value })}
                        placeholder="Ex : vanne spéciale (devis fournisseur X)"
                      />
                    </Field>
                  ) : (
                  <div className="trav-grid">
                    <Field label="Catégorie">
                      <select
                        value={l.categorie}
                        onChange={(e) => updateTravauxLine(l.id, { categorie: e.target.value, materiel: '', ref: '', prixUnitaire: 0 })}
                      >
                        <option value="">—</option>
                        {Object.keys(CATEGORIES).map((c) => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </Field>
                    <Field label="Matériel">
                      <select
                        value={l.materiel}
                        disabled={!l.categorie}
                        onChange={(e) => updateTravauxLine(l.id, { materiel: e.target.value, ref: '', prixUnitaire: 0 })}
                      >
                        <option value="">—</option>
                        {materiels.map((m) => <option key={m} value={m}>{m}</option>)}
                      </select>
                    </Field>
                  </div>
                  )}
                  <div className="trav-bottom">
                    {!l.fournisseur && (
                    <Field label="Dimension / Réf.">
                      <select
                        value={l.ref}
                        disabled={!l.materiel}
                        onChange={(e) => {
                          const found = refs.find((r) => r.ref === e.target.value);
                          updateTravauxLine(l.id, { ref: e.target.value, prixUnitaire: found && found.prix != null ? found.prix : 0 });
                        }}
                      >
                        <option value="">—</option>
                        {refs.map((r) => <option key={r.ref} value={r.ref}>{r.ref}{r.prix != null ? ` — ${r.prix}€` : ''}</option>)}
                      </select>
                    </Field>
                    )}
                    <Field label="Quantité">
                      <input
                        type="number" min="0" step="1" className="mono"
                        value={l.quantite}
                        onChange={(e) => updateTravauxLine(l.id, { quantite: parseFloat(e.target.value) || 0 })}
                      />
                    </Field>
                    <button className="trav-remove" onClick={() => removeTravauxLine(l.id)}><Trash2 size={15} /></button>
                  </div>
                  <Field label={l.fournisseur ? "Prix d'achat fournisseur (€)" : "P.U. (€) — modifiable"}>
                    <input
                      type="number" min="0" step="0.01" className="mono"
                      value={l.prixUnitaire}
                      onChange={(e) => updateTravauxLine(l.id, { prixUnitaire: parseFloat(e.target.value) || 0 })}
                    />
                  </Field>
                  {!l.fournisseur && l.ref && l.prixUnitaire === 0 && (
                    <div className="price-flag"><AlertCircle size={12} /> Prix non renseigné dans le catalogue — à saisir</div>
                  )}
                  <div className="trav-total-line">
                    <span>Total ligne</span>
                    <span className="mono">{euros((Number(l.quantite) || 0) * (Number(l.prixUnitaire) || 0))}</span>
                  </div>
                </div>
              );
            })}
            <button className="add-line-btn" onClick={addTravauxLine}><Plus size={15} /> Ajouter une ligne</button>
          </RivetPlate>

          <div className="totals-strip">
            <div className="totals-row"><span>Sous-total main d'œuvre</span><span className="mono">{euros(totals.moTotal)}</span></div>
            <div className="totals-row"><span>Sous-total travaux (achat)</span><span className="mono">{euros(totals.travTotalAchat)}</span></div>
            <div className="totals-row"><span>Marge ({devis.marge}%)</span><span className="mono">{euros(totals.travTotal - totals.travTotalAchat)}</span></div>
            <div className="totals-row"><span>Sous-total travaux (avec marge)</span><span className="mono">{euros(totals.travTotal)}</span></div>
            <div className="totals-row grand"><span>Total</span><span className="mono">{euros(totals.total)}</span></div>
          </div>

          <div className="btn-row">
            <button className="save-btn" onClick={saveDevis}><Save size={16} /> Enregistrer le devis</button>
            <button className="print-btn" onClick={() => { exportDevisFile(); window.print(); }}><FileText size={16} /> Imprimer / PDF</button>
          </div>
          <div className="btn-row">
            <button className="print-btn" onClick={exportDevisFile}><Archive size={16} /> Exporter (fichier .json)</button>
            <label className="print-btn file-import-btn">
              <Archive size={16} /> Importer un fichier
              <input
                type="file"
                accept="application/json"
                style={{ display: 'none' }}
                onChange={(e) => { if (e.target.files[0]) importDevisFile(e.target.files[0]); e.target.value = ''; }}
              />
            </label>
          </div>
        </div>
      )}

      {tab === 'devis' && (
        <div className="content">
          {loading ? (
            <div className="empty-state">Chargement...</div>
          ) : savedList.length === 0 ? (
            <div className="empty-state">
              <Archive size={34} />
              <div>Aucun devis enregistré pour l'instant.</div>
            </div>
          ) : (
            <React.Fragment>
              <div className="new-client-row" style={{marginBottom: '14px'}}>
                <input
                  placeholder="Nom du nouveau dossier..."
                  value={newFolderName}
                  onChange={(e) => setNewFolderName(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter' && newFolderName.trim()) {
                      addCustomFolder(newFolderName.trim());
                      showToast('Dossier créé');
                      setNewFolderName('');
                    }
                  }}
                />
                <button
                  className="new-client-btn"
                  disabled={!newFolderName.trim()}
                  onClick={() => {
                    addCustomFolder(newFolderName.trim());
                    showToast('Dossier créé');
                    setNewFolderName('');
                  }}
                >
                  <Plus size={15} /> Dossier
                </button>
              </div>

              {(() => {
                const sorted = savedList.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
                const racine = sorted.filter((e) => !e.dossier);
                const parDossier = {};
                allFolders.forEach((f) => { parDossier[f] = sorted.filter((e) => e.dossier === f); });

                const renderItem = (e) => (
                  <div className="saved-item" key={e.id} onClick={() => loadDevis(e.id)}>
                    <div className="saved-top">
                      <span className="saved-numero">{e.numero}</span>
                      <span className="saved-total mono">{euros(e.total)}</span>
                    </div>
                    <div className="saved-meta">
                      <span>{e.client}</span>
                      <span>
                        {e.date}
                        <button className="saved-del" onClick={(ev) => { ev.stopPropagation(); deleteDevis(e.id); }}><Trash2 size={13} /></button>
                      </span>
                    </div>
                  </div>
                );

                return (
                  <React.Fragment>
                    {allFolders.map((f) => {
                      const items = parDossier[f];
                      const isOpen = openFolders[f] !== false; // ouvert par défaut
                      return (
                        <div key={f} className="folder-group">
                          <div className="folder-header" onClick={() => setOpenFolders((o) => ({ ...o, [f]: !isOpen }))}>
                            <ChevronDown size={15} className={isOpen ? 'folder-chevron open' : 'folder-chevron'} />
                            <span className="folder-name">{f}</span>
                            <span className="folder-count">{items.length}</span>
                          </div>
                          {isOpen && (items.length ? items.map(renderItem) : (
                            <div className="folder-empty">Dossier vide</div>
                          ))}
                        </div>
                      );
                    })}
                    {racine.length > 0 && (
                      <div className="folder-group">
                        {allFolders.length > 0 && <div className="folder-header folder-header-root"><span className="folder-name">Sans dossier</span></div>}
                        {racine.map(renderItem)}
                      </div>
                    )}
                  </React.Fragment>
                );
              })()}
            </React.Fragment>
          )}
        </div>
      )}

      {tab === 'clients' && (
        <div className="content">
          <RivetPlate>
            <div className="section-label"><Users size={13} /> Nouveau client <span className="rule" /></div>
            <div className="new-client-row">
              <input
                placeholder="Nom du client..."
                value={newClientName}
                onChange={(e) => setNewClientName(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter' && newClientName.trim()) {
                    addCustomClient(newClientName.trim());
                    showToast('Client ajouté');
                    setNewClientName('');
                  }
                }}
              />
              <button
                className="new-client-btn"
                disabled={!newClientName.trim()}
                onClick={() => {
                  addCustomClient(newClientName.trim());
                  showToast('Client ajouté');
                  setNewClientName('');
                }}
              >
                <Plus size={15} /> Ajouter
              </button>
            </div>
          </RivetPlate>
          <div className="search-clients">
            <Search size={15} />
            <input placeholder="Rechercher un client..." value={clientQuery} onChange={(e) => setClientQuery(e.target.value)} />
          </div>
          {filteredClients.map((c) => (
            <div className="client-list-item" key={c}>{c}</div>
          ))}
          {clientQuery.trim() && !allClients.some((c) => c.toLowerCase() === clientQuery.trim().toLowerCase()) && (
            <button className="add-line-btn" onClick={() => { addCustomClient(clientQuery.trim()); setClientQuery(''); }}>
              <Plus size={15} /> Ajouter "{clientQuery.trim()}" comme client
            </button>
          )}
        </div>
      )}

      <div className="print-sheet">
        <div className="p-letterhead">
          <img src={LOGO_SLVS} alt="SLVS" />
          <div className="p-coords">
            Zone jaune, zone industrielle de Rouxmesnil-Bouteilles — 76379 Dieppe Cedex<br />
            02 35 06 00 13 — slvs@slvs-tuyauterie.fr
          </div>
        </div>
        <h1>{devis.type} {devis.numero ? `n° ${devis.numero}` : ''}</h1>
        <div className="p-meta">Tuyauterie · Chaudronnerie · Maintenance industrielle — {devis.date}</div>
        <div className="p-head-grid">
          <div><b>Client :</b> {devis.client || '—'}</div>
          <div><b>Mode :</b> {devis.mode}</div>
          <div><b>Donneur d'ordre :</b> {devis.donneurOrdre || '—'}</div>
          <div><b>Chantier / site :</b> {devis.chantier || '—'}</div>
        </div>
        {devis.texte && (
          <div className="p-texte">
            {splitTexteLignes(devis.texte).map((ligne, i) => (
              <div key={i} className="p-texte-line">{ligne}</div>
            ))}
          </div>
        )}

        <div className="p-section-title">Main d'œuvre</div>
        <table>
          <thead><tr><th>Poste</th><th className="num">Nb / Montant</th><th className="num">Tarif / Marge</th><th className="num">Total</th></tr></thead>
          <tbody>
            {devis.mainOeuvre.map((l) => (
              <tr key={l.id}>
                <td>{l.poste}</td>
                <td className="num">{l.nombre}</td>
                <td className="num">{l.tarif} €</td>
                <td className="num">{euros((Number(l.nombre) || 0) * (Number(l.tarif) || 0))}</td>
              </tr>
            ))}
            <tr>
              <td>Consommable</td>
              <td className="num">{euros(devis.consommable.montant)}</td>
              <td className="num">{devis.consommable.marge}%</td>
              <td className="num">{euros(totals.consoTotal)}</td>
            </tr>
            <tr>
              <td>Sous-traitant</td>
              <td className="num">{euros(devis.sousTraitant.montant)}</td>
              <td className="num">{devis.sousTraitant.marge}%</td>
              <td className="num">{euros(totals.stTotal)}</td>
            </tr>
          </tbody>
        </table>

        <div className="p-section-title">Matériel / Travaux</div>
        <table>
          <thead><tr><th>Désignation</th><th>Réf.</th><th className="num">Qté</th><th className="num">P.U.</th><th className="num">Total</th></tr></thead>
          <tbody>
            {devis.travaux.map((l) => (
              <tr key={l.id}>
                <td>{l.fournisseur ? (l.designation || 'Devis fournisseur') : (l.materiel || '—')}</td>
                <td>{l.fournisseur ? '—' : (l.ref || '—')}</td>
                <td className="num">{l.quantite}</td>
                <td className="num">{euros(l.prixUnitaire)}</td>
                <td className="num">{euros((Number(l.quantite) || 0) * (Number(l.prixUnitaire) || 0))}</td>
              </tr>
            ))}
          </tbody>
        </table>

        <div className="p-totals">
          <div><span>Sous-total main d'œuvre</span><span>{euros(totals.moTotal)}</span></div>
          <div><span>Sous-total travaux (achat)</span><span>{euros(totals.travTotalAchat)}</span></div>
          <div><span>Marge ({devis.marge}%)</span><span>{euros(totals.travTotal - totals.travTotalAchat)}</span></div>
          <div className="p-grand"><span>Total</span><span>{euros(totals.total)}</span></div>
        </div>
      </div>

      <div className="bottom-nav">
        <button className={`nav-btn ${tab === 'nouveau' ? 'active' : ''}`} onClick={() => setTab('nouveau')}>
          <FileText size={19} /> Devis en cours
        </button>
        <button className={`nav-btn ${tab === 'devis' ? 'active' : ''}`} onClick={() => setTab('devis')}>
          <Archive size={19} /> Enregistrés
        </button>
        <button className={`nav-btn ${tab === 'clients' ? 'active' : ''}`} onClick={() => setTab('clients')}>
          <Users size={19} /> Clients
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DevisApp />);

</script>
</body>
</html>
