const CATEGORIES = [...new Set(MATERIALS.map(m => m.category))];

const DEFAULT_RATES = { heures: 55, samedi: 75, etude: 60 };
const DEFAULT_MARGINS = { sousTraitants: 1.2, fournituresDiverses: 1.35, consommables: 1.35, fournitures: 1.35 };

function euros(n) {
  if (n === null || n === undefined || isNaN(n)) return "—";
  return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " \u20ac";
}

function DimensionTotal({ value }) {
  return (
    <div className="flex items-center w-full select-none">
      <div className="flex-1 flex items-center">
        <div className="w-2 h-2 border-l-2 border-t-2 border-[#FF6A13] rotate-[-45deg] -mr-1" />
        <div className="flex-1 h-px bg-[#FF6A13]" />
      </div>
      <div className="px-4 py-1 mx-1 bg-[#0F1315] border border-[#FF6A13]/50">
        <span className="font-mono text-2xl font-bold text-[#FF6A13] tracking-tight">{euros(value)}</span>
      </div>
      <div className="flex-1 flex items-center">
        <div className="flex-1 h-px bg-[#FF6A13]" />
        <div className="w-2 h-2 border-r-2 border-b-2 border-[#FF6A13] rotate-[-45deg] -ml-1" />
      </div>
    </div>
  );
}

function TickCorners() {
  return (
    <>
      <span className="absolute -top-px -left-px w-2 h-2 border-t border-l border-[#5B8BA6]" />
      <span className="absolute -top-px -right-px w-2 h-2 border-t border-r border-[#5B8BA6]" />
      <span className="absolute -bottom-px -left-px w-2 h-2 border-b border-l border-[#5B8BA6]" />
      <span className="absolute -bottom-px -right-px w-2 h-2 border-b border-r border-[#5B8BA6]" />
    </>
  );
}

function Panel({ eyebrow, title, children, className = "" }) {
  return (
    <section className={`relative border border-[#333F46] bg-[#1B2226] p-4 ${className}`}>
      <TickCorners />
      <div className="mb-3">
        {eyebrow && <div className="text-[10px] tracking-[0.2em] text-[#5B8BA6] font-mono uppercase">{eyebrow}</div>}
        {title && <h2 className="text-lg font-black uppercase tracking-tight text-[#ECEAE2]">{title}</h2>}
      </div>
      {children}
    </section>
  );
}

function NumField({ label, unit, value, onChange, rate }) {
  const sub = rate ? (Number(value) || 0) * rate : null;
  return (
    <div className="flex items-center justify-between gap-3 py-2 border-b border-[#2A333A] last:border-0">
      <div className="flex-1 min-w-0">
        <div className="text-sm text-[#ECEAE2]">{label}</div>
        {rate && <div className="text-[11px] font-mono text-[#8A9199]">{rate} \u20ac/h</div>}
      </div>
      <input
        type="number"
        inputMode="decimal"
        min="0"
        value={value}
        onChange={(e) => onChange(e.target.value)}
        className="w-20 bg-[#0F1315] border border-[#333F46] text-[#ECEAE2] font-mono text-right px-2 py-2 text-sm focus:outline-none focus:border-[#5B8BA6]"
        placeholder="0"
      />
      {rate && (
        <div className="w-24 text-right font-mono text-sm text-[#5B8BA6]">{euros(sub)}</div>
      )}
    </div>
  );
}

function MiniField({ label, value, onChange, suffix }) {
  return (
    <div className="flex items-center justify-between gap-3 py-2 border-b border-[#2A333A] last:border-0">
      <div className="text-sm text-[#ECEAE2]">{label}</div>
      <div className="flex items-center gap-1">
        <input
          type="number"
          inputMode="decimal"
          step="0.01"
          value={value}
          onChange={(e) => onChange(e.target.value)}
          className="w-20 bg-[#0F1315] border border-[#333F46] text-[#ECEAE2] font-mono text-right px-2 py-2 text-sm focus:outline-none focus:border-[#FF6A13]"
        />
        <span className="text-[11px] font-mono text-[#8A9199] w-6">{suffix}</span>
      </div>
    </div>
  );
}

function Select({ value, onChange, options, placeholder }) {
  return (
    <div className="relative">
      <select
        value={value}
        onChange={(e) => onChange(e.target.value)}
        className="w-full appearance-none bg-[#0F1315] border border-[#333F46] text-[#ECEAE2] px-3 py-3 text-sm focus:outline-none focus:border-[#5B8BA6]"
      >
        <option value="">{placeholder}</option>
        {options.map((o) => (
          <option key={o.value} value={o.value}>{o.label}</option>
        ))}
      </select>
      <ChevronDown className="absolute right-2 top-1/2 -translate-y-1/2 w-4 h-4 text-[#8A9199] pointer-events-none" />
    </div>
  );
}

function DevisApp() {
  const [clientsList, setClientsList] = useState(CLIENTS);
  const [client, setClient] = useState("");
  const [addingClient, setAddingClient] = useState(false);
  const [newClientName, setNewClientName] = useState("");
  const [chantier, setChantier] = useState("");
  const [notes, setNotes] = useState("");
  const [mode, setMode] = useState("direct");
  const [donneurOrdre, setDonneurOrdre] = useState("");

  const [heures, setHeures] = useState("");
  const [heuresSamedi, setHeuresSamedi] = useState("");
  const [etude, setEtude] = useState("");

  const [showReglages, setShowReglages] = useState(false);
  const [rates, setRates] = useState(DEFAULT_RATES);
  const [margins, setMargins] = useState(DEFAULT_MARGINS);

  function updateRate(key, val) {
    setRates((r) => ({ ...r, [key]: val === "" ? "" : Number(val) }));
  }
  function updateMargin(key, val) {
    setMargins((m) => ({ ...m, [key]: val === "" ? "" : Number(val) }));
  }

  const [category, setCategory] = useState("");
  const [materialName, setMaterialName] = useState("");
  const [itemIdx, setItemIdx] = useState("");
  const [qty, setQty] = useState("");
  const [customPU, setCustomPU] = useState("");

  const [lignes, setLignes] = useState([]);

  const [sousTraitants, setSousTraitants] = useState("");
  const [fournituresDiverses, setFournituresDiverses] = useState("");
  const [consommables, setConsommables] = useState("");

  const [listening, setListening] = useState(false);
  const [voiceText, setVoiceText] = useState("");
  const recRef = useRef(null);

  const [texteDevis, setTexteDevis] = useState("");
  const [listeningDesc, setListeningDesc] = useState(false);
  const [voiceErrorDesc, setVoiceErrorDesc] = useState("");
  const recDescRef = useRef(null);

  const materialsInCategory = useMemo(
    () => MATERIALS.filter((m) => m.category === category),
    [category]
  );
  const currentMaterial = useMemo(
    () => materialsInCategory.find((m) => m.name === materialName),
    [materialsInCategory, materialName]
  );
  const currentItem = currentMaterial && itemIdx !== "" ? currentMaterial.items[Number(itemIdx)] : null;

  const effectivePU = customPU !== "" ? Number(customPU) : currentItem?.price ?? null;

  function addLigne() {
    if (!currentMaterial || itemIdx === "" || !qty) return;
    setLignes((ls) => [
      ...ls,
      {
        id: Date.now(),
        materiau: currentMaterial.name,
        dim: currentItem.label,
        qty: Number(qty),
        pu: effectivePU ?? 0,
      },
    ]);
    setItemIdx("");
    setQty("");
    setCustomPU("");
  }

  function addClient() {
    const name = newClientName.trim();
    if (!name) return;
    if (!clientsList.includes(name)) setClientsList((cs) => [...cs, name]);
    setClient(name);
    setNewClientName("");
    setAddingClient(false);
  }

  function removeLigne(id) {
    setLignes((ls) => ls.filter((l) => l.id !== id));
  }

  const totalMainOeuvre =
    (Number(heures) || 0) * (Number(rates.heures) || 0) +
    (Number(heuresSamedi) || 0) * (Number(rates.samedi) || 0) +
    (Number(etude) || 0) * (Number(rates.etude) || 0);

  const totalMatiere = lignes.reduce((s, l) => s + l.qty * l.pu, 0);

  const totalSousTraitants = (Number(sousTraitants) || 0) * (Number(margins.sousTraitants) || 0);
  const totalFournituresDiverses = (Number(fournituresDiverses) || 0) * (Number(margins.fournituresDiverses) || 0);
  const totalConsommables = (Number(consommables) || 0) * (Number(margins.consommables) || 0);
  const totalFournitures = totalMatiere * (Number(margins.fournitures) || 0);

  const grandTotal =
    totalMainOeuvre + totalSousTraitants + totalFournituresDiverses + totalConsommables + totalFournitures;

  function voiceErrorMessage(code) {
    if (code === "not-allowed" || code === "service-not-allowed")
      return "Micro refuse ou non accessible ici. Autorise le micro dans les reglages du navigateur, ou teste hors de cet apercu.";
    if (code === "no-speech") return "Rien entendu, reessaie.";
    if (code === "audio-capture") return "Aucun micro detecte sur cet appareil.";
    if (code === "network") return "Connexion reseau necessaire pour la dictee.";
    return `Micro indisponible (${code || "erreur inconnue"}). Essaie hors de cet apercu.`;
  }

  function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setVoiceText("Reconnaissance vocale non disponible sur ce navigateur.");
      return;
    }
    const rec = new SR();
    rec.lang = "fr-FR";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      setVoiceText(transcript);
      applyVoiceGuess(transcript);
    };
    rec.onend = () => setListening(false);
    rec.onerror = (e) => {
      setListening(false);
      setVoiceText(voiceErrorMessage(e.error));
    };
    recRef.current = rec;
    try {
      rec.start();
      setListening(true);
    } catch (err) {
      setVoiceText(voiceErrorMessage(err?.message));
      setListening(false);
    }
  }

  function stopVoice() {
    recRef.current?.stop();
    setListening(false);
  }

  function startVoiceDesc() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setTexteDevis((t) => t);
      setVoiceErrorDesc("Reconnaissance vocale non disponible sur ce navigateur.");
      return;
    }
    const rec = new SR();
    rec.lang = "fr-FR";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      setTexteDevis((t) => (t ? t.trim() + " " + transcript : transcript));
      setVoiceErrorDesc("");
    };
    rec.onend = () => setListeningDesc(false);
    rec.onerror = (e) => {
      setListeningDesc(false);
      setVoiceErrorDesc(voiceErrorMessage(e.error));
    };
    recDescRef.current = rec;
    try {
      rec.start();
      setListeningDesc(true);
    } catch (err) {
      setVoiceErrorDesc(voiceErrorMessage(err?.message));
      setListeningDesc(false);
    }
  }

  function stopVoiceDesc() {
    recDescRef.current?.stop();
    setListeningDesc(false);
  }

  function applyVoiceGuess(text) {
    const t = text.toLowerCase();
    let foundMat = null;
    for (const m of MATERIALS) {
      const key = m.name.toLowerCase().replace(/_/g, " ");
      if (key.split(" ").some((w) => w.length > 3 && t.includes(w))) {
        foundMat = m;
        break;
      }
    }
    if (foundMat) {
      setCategory(foundMat.category);
      setMaterialName(foundMat.name);
      const numMatch = t.match(/(\\d+([.,]\\d+)?)/);
      if (numMatch && foundMat.items.length) {
        const target = parseFloat(numMatch[1].replace(",", "."));
        let bestIdx = 0;
        let bestDiff = Infinity;
        foundMat.items.forEach((it, idx) => {
          const n = parseFloat((it.label.match(/[\\d.]+/) || [""])[0]);
          if (!isNaN(n)) {
            const diff = Math.abs(n - target);
            if (diff < bestDiff) {
              bestDiff = diff;
              bestIdx = idx;
            }
          }
        });
        setItemIdx(String(bestIdx));
      }
    }
    const qtyMatch = t.match(/(\\d+)\\s*(m\\u00e8tres|metres|pi\\u00e8ces|unit\\u00e9s)/);
    if (qtyMatch) setQty(qtyMatch[1]);
  }

  function exportTexte() {
    const lignesTxt = lignes
      .map((l) => `  - ${l.materiau} ${l.dim} \u2014 qte ${l.qty} \u00d7 ${euros(l.pu)} = ${euros(l.qty * l.pu)}`)
      .join("\n");
    const txt = `DEVIS\nClient: ${client || "-"}\nChantier: ${chantier || "-"}\nMode: ${mode === "direct" ? "Direct" : "Sous-traitance pour " + (donneurOrdre || "-")}\n${texteDevis ? "\n" + texteDevis + "\n" : ""}\nMAIN D'OEUVRE\n  Heures: ${heures || 0} x ${rates.heures}\u20ac\n  Heures samedi: ${heuresSamedi || 0} x ${rates.samedi}\u20ac\n  Etude: ${etude || 0} x ${rates.etude}\u20ac\n  Sous-total: ${euros(totalMainOeuvre)}\n\nTRAVAUX\n${lignesTxt || "  (aucune ligne)"}\n  Sous-total matiere: ${euros(totalMatiere)}\n${notes ? "\nNOTES\n" + notes + "\n" : ""}\nTOTAL: ${euros(grandTotal)}\n`;
    const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `devis_${(client || "client").replace(/\\s+/g, "_")}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

  return (
    <div className="min-h-screen bg-[#14181B] text-[#ECEAE2] pb-32">
      <header className="print:hidden border-b border-[#333F46] bg-[#0F1315] px-4 py-4 sticky top-0 z-10">
        <div className="flex items-center gap-2">
          <Wrench className="w-5 h-5 text-[#FF6A13]" />
          <div className="text-[10px] tracking-[0.25em] text-[#5B8BA6] font-mono uppercase">
            Atelier Tuyauterie / Chaudronnerie
          </div>
        </div>
        <h1 className="text-2xl font-black uppercase tracking-tight mt-1">Carnet de devis</h1>
      </header>

      <main className="print:hidden px-4 py-4 space-y-4 max-w-xl mx-auto">
        <Panel eyebrow="Cartouche" title="Chantier">
          <div className="space-y-3">
            <div>
              <label className="text-[11px] font-mono text-[#8A9199] uppercase">Client</label>
              {!addingClient ? (
                <Select
                  value={client}
                  onChange={(v) => (v === "__new__" ? setAddingClient(true) : setClient(v))}
                  placeholder="Choisir un client"
                  options={[
                    ...clientsList.map((c) => ({ value: c, label: c })),
                    { value: "__new__", label: "+ Ajouter un client" },
                  ]}
                />
              ) : (
                <div className="flex gap-2">
                  <input
                    autoFocus
                    value={newClientName}
                    onChange={(e) => setNewClientName(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && addClient()}
                    placeholder="Nom du nouveau client"
                    className="flex-1 bg-[#0F1315] border border-[#333F46] text-[#ECEAE2] px-3 py-3 text-sm focus:outline-none focus:border-[#5B8BA6]"
                  />
                  <button
                    onClick={addClient}
                    className="px-3 bg-[#FF6A13] text-[#0F1315]"
                    title="Ajouter"
                  >
                    <UserPlus className="w-4 h-4" />
                  </button>
                  <button
                    onClick={() => { setAddingClient(false); setNewClientName(""); }}
                    className="px-3 border border-[#333F46] text-[#8A9199]"
                    title="Annuler"
                  >
                    <X className="w-4 h-4" />
                  </button>
                </div>
              )}
            </div>
            <div>
              <label className="text-[11px] font-mono text-[#8A9199] uppercase">Chantier / Site</label>
              <input
                value={chantier}
                onChange={(e) => setChantier(e.target.value)}
                placeholder="ex: Dieppe, cabines mastics"
                className="w-full bg-[#0F1315] border border-[#333F46] text-[#ECEAE2] px-3 py-3 text-sm focus:outline-none focus:border-[#5B8BA6]"
              />
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => setMode("direct")}
                className={`flex-1 py-2 text-xs font-mono uppercase border ${mode === "direct" ? "bg-[#5B8BA6] border-[#5B8BA6] text-[#0F1315]" : "border-[#333F46] text-[#8A9199]"}`}
              >
                Direct
              </button>
              <button
                onClick={() => setMode("sous-traitance")}
                className={`flex-1 py-2 text-xs font-mono uppercase border ${mode === "sous-traitance" ? "bg-[#5B8BA6] border-[#5B8BA6] text-[#0F1315]" : "border-[#333F46] text-[#8A9199]"}`}
              >
                Sous-traitance
              </button>
            </div>
            {mode === "sous-traitance" && (
              <input
                value={donneurOrdre}
                onChange={(e) => setDonneurOrdre(e.target.value)}
                placeholder="Donneur d'ordre (ex: EPI Europe)"
                className="w-full bg-[#0F1315] border border-[#333F46] text-[#ECEAE2] px-3 py-3 text-sm focus:outline-none focus:border-[#5B8BA6]"
              />
            )}
          </div>
        </Panel>

        <button
          onClick={() => setShowReglages((s) => !s)}
          className="w-full flex items-center justify-center gap-2 py-2 text-[11px] font-mono uppercase tracking-wide text-[#8A9199] border border-dashed border-[#333F46]"
        >
          {showReglages ? <X className="w-3.5 h-3.5" /> : <Settings className="w-3.5 h-3.5" />}
          {showReglages ? "Fermer les reglages" : "Tarifs horaires & marges"}
        </button>

        {showReglages && (
          <Panel eyebrow="Reglages" title="Tarifs & marges">
            <div className="text-[11px] font-mono text-[#8A9199] uppercase mb-1">Taux horaires</div>
            <MiniField label="Heures" value={rates.heures} onChange={(v) => updateRate("heures", v)} suffix="\u20ac/h" />
            <MiniField label="Heures samedi" value={rates.samedi} onChange={(v) => updateRate("samedi", v)} suffix="\u20ac/h" />
            <MiniField label="Etude" value={rates.etude} onChange={(v) => updateRate("etude", v)} suffix="\u20ac/h" />
            <div className="text-[11px] font-mono text-[#8A9199] uppercase mb-1 mt-3">Marges</div>
            <MiniField label="Sous-traitants" value={margins.sousTraitants} onChange={(v) => updateMargin("sousTraitants", v)} suffix="\u00d7" />
            <MiniField label="Fournitures diverses" value={margins.fournituresDiverses} onChange={(v) => updateMargin("fournituresDiverses", v)} suffix="\u00d7" />
            <MiniField label="Consommables" value={margins.consommables} onChange={(v) => updateMargin("consommables", v)} suffix="\u00d7" />
            <MiniField label="Fournitures (matiere)" value={margins.fournitures} onChange={(v) => updateMargin("fournitures", v)} suffix="\u00d7" />
          </Panel>
        )}

        <Panel eyebrow="Poste 1" title="Main d'oeuvre">
          <NumField label="Heures" value={heures} onChange={setHeures} rate={rates.heures} />
          <NumField label="Heures samedi" value={heuresSamedi} onChange={setHeuresSamedi} rate={rates.samedi} />
          <NumField label="Etude" value={etude} onChange={setEtude} rate={rates.etude} />
          <div className="flex justify-between pt-2 mt-1 border-t border-[#2A333A]">
            <span className="text-xs font-mono uppercase text-[#8A9199]">Sous-total</span>
            <span className="font-mono text-sm text-[#ECEAE2]">{euros(totalMainOeuvre)}</span>
          </div>
        </Panel>

        <Panel eyebrow="Poste 2" title="Texte du devis">
          <div className="space-y-2">
            <button
              onClick={listeningDesc ? stopVoiceDesc : startVoiceDesc}
              className={`w-full flex items-center justify-center gap-2 py-2.5 text-xs font-mono uppercase border ${listeningDesc ? "bg-[#FF6A13] border-[#FF6A13] text-[#0F1315]" : "border-[#5B8BA6] text-[#5B8BA6]"}`}
            >
              {listeningDesc ? <MicOff className="w-4 h-4" /> : <Mic className="w-4 h-4" />}
              {listeningDesc ? "Ecoute..." : "Dicter le texte"}
            </button>
            {voiceErrorDesc && (
              <div className="text-[11px] font-mono text-[#FF6A13] px-1">{voiceErrorDesc}</div>
            )}
            <div className="text-[10px] font-mono text-[#4a5158] px-1">
              Necessite l'autorisation du micro dans le navigateur (peut ne pas fonctionner dans cet apercu integre).
            </div>
            <textarea
              value={texteDevis}
              onChange={(e) => setTexteDevis(e.target.value)}
              placeholder="Description du chantier / des travaux a realiser..."
              rows={5}
              className="w-full bg-[#0F1315] border border-[#333F46] text-[#ECEAE2] px-3 py-2 text-sm focus:outline-none focus:border-[#5B8BA6] resize-none"
            />
          </div>
        </Panel>

        <Panel eyebrow="Poste 3" title="Travaux">
          <div className="space-y-2 mb-3">
            <button
              onClick={listening ? stopVoice : startVoice}
              className={`w-full flex items-center justify-center gap-2 py-2.5 text-xs font-mono uppercase border ${listening ? "bg-[#FF6A13] border-[#FF6A13] text-[#0F1315]" : "border-[#5B8BA6] text-[#5B8BA6]"}`}
            >
              {listening ? <MicOff className="w-4 h-4" /> : <Mic className="w-4 h-4" />}
              {listening ? "Ecoute..." : "Dicter une ligne"}
            </button>
            {voiceText && (
              <div className="text-[11px] font-mono text-[#8A9199] italic px-1">"{voiceText}"</div>
            )}
            <div className="text-[10px] font-mono text-[#4a5158] px-1">
              Necessite l'autorisation du micro dans le navigateur (peut ne pas fonctionner dans cet apercu integre).
            </div>
          </div>

          <div className="space-y-2">
            <Select
              value={category}
              onChange={(v) => { setCategory(v); setMaterialName(""); setItemIdx(""); }}
              placeholder="Categorie"
              options={CATEGORIES.map((c) => ({ value: c, label: c }))}
            />
            {category && (
              <Select
                value={materialName}
                onChange={(v) => { setMaterialName(v); setItemIdx(""); }}
                placeholder="Materiel"
                options={materialsInCategory.map((m) => ({ value: m.name, label: m.name.replace(/_/g, " ") }))}
              />
            )}
            {currentMaterial && (
              <Select
                value={itemIdx}
                onChange={setItemIdx}
                placeholder="Diametre / reference"
                options={currentMaterial.items.map((it, idx) => ({
                  value: String(idx),
                  label: `${it.label}${it.price !== null ? "  \u2014 " + euros(it.price) : "  \u2014 prix a definir"}`,
                }))}
              />
            )}
            {currentItem && (
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-[10px] font-mono text-[#8A9199] uppercase">Quantite</label>
                  <input
                    type="number"
                    inputMode="decimal"
                    value={qty}
                    onChange={(e) => setQty(e.target.value)}
                    placeholder="0"
                    className="w-full bg-[#0F1315] border border-[#333F46] text-[#ECEAE2] font-mono px-3 py-2.5 text-sm focus:outline-none focus:border-[#5B8BA6]"
                  />
                </div>
                <div>
                  <label className="text-[10px] font-mono text-[#8A9199] uppercase">P.U. (\u20ac)</label>
                  <input
                    type="number"
                    inputMode="decimal"
                    value={customPU}
                    onChange={(e) => setCustomPU(e.target.value)}
                    placeholder={currentItem.price !== null ? String(currentItem.price) : "0"}
                    className="w-full bg-[#0F1315] border border-[#333F46] text-[#ECEAE2] font-mono px-3 py-2.5 text-sm focus:outline-none focus:border-[#5B8BA6]"
                  />
                </div>
              </div>
            )}
            <button
              onClick={addLigne}
              disabled={!currentItem || !qty}
              className="w-full flex items-center justify-center gap-2 py-2.5 text-xs font-mono uppercase bg-[#FF6A13] disabled:bg-[#333F46] disabled:text-[#8A9199] text-[#0F1315] font-bold"
            >
              <Plus className="w-4 h-4" /> Ajouter la ligne
            </button>
          </div>

          {lignes.length > 0 && (
            <div className="mt-4 border-t border-[#2A333A] pt-3 space-y-2">
              {lignes.map((l) => (
                <div key={l.id} className="flex items-center justify-between gap-2 text-xs bg-[#0F1315] px-3 py-2 border border-[#2A333A]">
                  <div className="min-w-0 flex-1">
                    <div className="text-[#ECEAE2] truncate">{l.materiau.replace(/_/g, " ")}</div>
                    <div className="font-mono text-[#8A9199] truncate">{l.dim} \u00d7 {l.qty}</div>
                  </div>
                  <div className="font-mono text-[#5B8BA6] whitespace-nowrap">{euros(l.qty * l.pu)}</div>
                  <button onClick={() => removeLigne(l.id)} className="text-[#8A9199] hover:text-[#FF6A13]">
                    <Trash2 className="w-4 h-4" />
                  </button>
                </div>
              ))}
              <div className="flex justify-between pt-2 border-t border-[#2A333A]">
                <span className="text-xs font-mono uppercase text-[#8A9199]">Total matiere</span>
                <span className="font-mono text-sm text-[#ECEAE2]">{euros(totalMatiere)}</span>
              </div>
            </div>
          )}
        </Panel>

        <Panel eyebrow="Poste 4" title="Sous-traitants & fournitures">
          <NumField label={`Sous-traitants (\u00d7 ${margins.sousTraitants})`} value={sousTraitants} onChange={setSousTraitants} />
          <NumField label={`Fournitures diverses (\u00d7 ${margins.fournituresDiverses})`} value={fournituresDiverses} onChange={setFournituresDiverses} />
          <NumField label={`Consommables (\u00d7 ${margins.consommables})`} value={consommables} onChange={setConsommables} />
          <div className="flex items-center justify-between py-2">
            <div className="text-sm text-[#ECEAE2]">{`Fournitures (matiere \u00d7 ${margins.fournitures})`}</div>
            <div className="w-24 text-right font-mono text-sm text-[#5B8BA6]">{euros(totalFournitures)}</div>
          </div>
        </Panel>

        <Panel eyebrow="Poste 5" title="Notes & remarques">
          <div className="flex items-start gap-2">
            <StickyNote className="w-4 h-4 text-[#8A9199] mt-2 shrink-0" />
            <textarea
              value={notes}
              onChange={(e) => setNotes(e.target.value)}
              placeholder="Conditions particulieres, delais, acces chantier, validite du devis..."
              rows={4}
              className="w-full bg-[#0F1315] border border-[#333F46] text-[#ECEAE2] px-3 py-2 text-sm focus:outline-none focus:border-[#5B8BA6] resize-none"
            />
          </div>
        </Panel>

        <div className="grid grid-cols-3 gap-2 pt-2">
          <button
            onClick={exportTexte}
            className="flex items-center justify-center gap-2 py-3 text-xs font-mono uppercase border border-[#5B8BA6] text-[#5B8BA6]"
          >
            <FileDown className="w-4 h-4" /> Texte
          </button>
          <button
            onClick={() => window.print()}
            className="flex items-center justify-center gap-2 py-3 text-xs font-mono uppercase bg-[#FF6A13] text-[#0F1315] font-bold"
          >
            <Printer className="w-4 h-4" /> PDF
          </button>
          <button
            disabled
            title="Connexion OneDrive a activer prochainement"
            className="flex items-center justify-center gap-2 py-3 text-xs font-mono uppercase border border-[#333F46] text-[#4a5158] cursor-not-allowed"
          >
            <Cloud className="w-4 h-4" /> OneDrive
          </button>
        </div>
      </main>

      {/* Version imprimable - visible uniquement a l'impression / export PDF */}
      <div className="hidden print:block bg-white text-black p-8 font-sans">
        <div className="flex items-start justify-between border-b-2 border-black pb-4 mb-6">
          <img src={LOGO_SLVS} alt="Logo SLVS" className="h-20 w-auto object-contain" />
          <div className="text-right">
            <h1 className="text-2xl font-black uppercase">Devis</h1>
            <div className="text-sm text-gray-600">{new Date().toLocaleDateString("fr-FR")}</div>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-4 mb-6 text-sm">
          <div>
            <div className="text-gray-500 uppercase text-xs">Client</div>
            <div className="font-bold">{client || "-"}</div>
          </div>
          <div>
            <div className="text-gray-500 uppercase text-xs">Chantier</div>
            <div className="font-bold">{chantier || "-"}</div>
          </div>
          <div>
            <div className="text-gray-500 uppercase text-xs">Mode</div>
            <div>{mode === "direct" ? "Direct" : `Sous-traitance pour ${donneurOrdre || "-"}`}</div>
          </div>
        </div>

        {texteDevis && (
          <>
            <h2 className="font-bold uppercase text-sm border-b border-black mb-2 pb-1">Description</h2>
            <p className="text-sm mb-4 whitespace-pre-wrap">{texteDevis}</p>
          </>
        )}

        <h2 className="font-bold uppercase text-sm border-b border-black mb-2 pb-1">Main d'oeuvre</h2>
        <table className="w-full text-sm mb-4">
          <tbody>
            <tr><td className="py-1">Heures</td><td className="text-right">{heures || 0} \u00d7 {rates.heures}\u20ac</td><td className="text-right w-24">{euros((Number(heures)||0)*(Number(rates.heures)||0))}</td></tr>
            <tr><td className="py-1">Heures samedi</td><td className="text-right">{heuresSamedi || 0} \u00d7 {rates.samedi}\u20ac</td><td className="text-right w-24">{euros((Number(heuresSamedi)||0)*(Number(rates.samedi)||0))}</td></tr>
            <tr><td className="py-1">Etude</td><td className="text-right">{etude || 0} \u00d7 {rates.etude}\u20ac</td><td className="text-right w-24">{euros((Number(etude)||0)*(Number(rates.etude)||0))}</td></tr>
          </tbody>
        </table>

        <h2 className="font-bold uppercase text-sm border-b border-black mb-2 pb-1">Travaux</h2>
        <table className="w-full text-sm mb-4">
          <tbody>
            {lignes.length === 0 && <tr><td className="py-1 text-gray-400">Aucune ligne</td></tr>}
            {lignes.map((l) => (
              <tr key={l.id}>
                <td className="py-1">{l.materiau.replace(/_/g, " ")} \u2014 {l.dim}</td>
                <td className="text-right">{l.qty} \u00d7 {euros(l.pu)}</td>
                <td className="text-right w-24">{euros(l.qty * l.pu)}</td>
              </tr>
            ))}
          </tbody>
        </table>

        <h2 className="font-bold uppercase text-sm border-b border-black mb-2 pb-1">Sous-traitants & fournitures</h2>
        <table className="w-full text-sm mb-4">
          <tbody>
            <tr><td className="py-1">Sous-traitants</td><td className="text-right w-24">{euros(totalSousTraitants)}</td></tr>
            <tr><td className="py-1">Fournitures diverses</td><td className="text-right w-24">{euros(totalFournituresDiverses)}</td></tr>
            <tr><td className="py-1">Consommables</td><td className="text-right w-24">{euros(totalConsommables)}</td></tr>
            <tr><td className="py-1">Fournitures (matiere)</td><td className="text-right w-24">{euros(totalFournitures)}</td></tr>
          </tbody>
        </table>

        {notes && (
          <>
            <h2 className="font-bold uppercase text-sm border-b border-black mb-2 pb-1">Notes & remarques</h2>
            <p className="text-sm mb-4 whitespace-pre-wrap">{notes}</p>
          </>
        )}

        <div className="flex justify-end border-t-2 border-black pt-3 mt-6">
          <div className="text-right">
            <div className="text-xs uppercase text-gray-500">Total devis</div>
            <div className="text-2xl font-black">{euros(grandTotal)}</div>
          </div>
        </div>
      </div>

      <div className="print:hidden fixed bottom-0 left-0 right-0 bg-[#0F1315] border-t border-[#333F46] px-4 py-3 z-20">
        <div className="max-w-xl mx-auto">
          <DimensionTotal value={grandTotal} />
        </div>
      </div>
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById("root")).render(<DevisApp />);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
